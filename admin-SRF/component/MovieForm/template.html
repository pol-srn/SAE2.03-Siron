<div class="movieForm">
    <h4 class="movieForm__title">Ajouter ou modifier un Film</h4>
    <form class="movieForm__form">

        <input class="movieForm__input" required type="text" name="name" placeholder="Saisir un titre">
        <input class="movieForm__input" required type="text" name="director" placeholder="Saisir un réalisateur">
        <input class="movieForm__input" required type="number" name="year" placeholder="Saisir l'année de sortie">
        <input class="movieForm__input" required type="number" name="length" placeholder="Saisir la durée du film">
        <input class="movieForm__input" required type="text" name="description" placeholder="Saisir la description">

        <select class="movieForm__select" name="id_category" id="id_category">
            {{idList}}
        </select>

        <input class="movieForm__input" required type="text" name="image" placeholder="Saisir le nom du fichier de l'affiche du film">
        <input class="movieForm__input" required type="text" name="trailer" placeholder="Saisir l'URL du trailer">

        <select class="movieForm__select" name="min_age" id="min_age">
            <option class="movieForm__option" value="1">Tout public</option>
            <option class="movieForm__option" value="7">interdit aux -7 ans</option>
            <option class="movieForm__option" value="12">interdit aux -12 ans</option>
            <option class="movieForm__option" value="16">interdit aux -16 ans</option>
            <option class="movieForm__option" value="18">interdit aux -18 ans</option>
        </select>

        <input class="movieForm__btn" onclick="{{handler}}" type="button" value="Update" name="todo">
    </form>
</div>
