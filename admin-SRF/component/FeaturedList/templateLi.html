<div class="featuredList__item">
    <div class="featuredList__info">
        <span class="featuredList__name"><b>{{name}}</b></span>
        <span class="featuredList__category"> - {{category}}</span>
        <span class="featuredList__status">({{statusText}})</span>
    </div>
    
    <button type="button" class="featuredList__btn featuredList__btn--{{btnState}}" onclick="{{hUpdate}}">
        {{btnText}}
    </button>
</div>
