<div class="featured-item">
    <div class="featured-item__info">
        <span class="featured-item__name"><b>{{name}}</b></span>
        <span class="featured-item__category"> - {{category}}</span>
        <span class="featured-item__status">({{statusText}})</span>
    </div>
    <button type="button" class="featured-item__btn featured-item__btn--{{btnState}}" onclick="{{hUpdate}}">
        {{btnText}}
    </button>
</div>
