<section class="statistics">
    <h2 class="statistics__title">Vue d'ensemble</h2>
    
    <div class="statistics__grid">
        <article class="stat-card">
            <p class="stat-card__label">PROFILS CRÉÉS</p>
            <p class="stat-card__number">{{total_profiles}}</p>
        </article>
        
        <article class="stat-card">
            <p class="stat-card__label">FILMS AU TOTAL</p>
            <p class="stat-card__number">{{total_movies}}</p>
        </article>
        
        <article class="stat-card">
            <p class="stat-card__label">MOYENNE FAVORIS / PROFIL</p>
            <p class="stat-card__number">{{moyenne_favoris}}</p>
        </article>
        
        <article class="stat-card">
            <p class="stat-card__label">FILM LE PLUS POPULAIRE</p>
            <p class="stat-card__text">{{top_movie}}</p>
        </article>
        
        <article class="stat-card">
            <p class="stat-card__label">CATÉGORIE STAR</p>
            <p class="stat-card__text">{{top_category}}</p>
        </article>
    </div>
</section>
