<!DOCTYPE html>
<html lang="fr">

<head>
  <title>SAE2.03 APP</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
</head>

<body>
  <header id="header"></header>

  <section id="content"></section>

  <script type="module">
    import { DataMovie } from "./data/dataMovie.js";
    import { NavBar } from "./component/NavBar/script.js";
    import { Movie } from "./component/Movie/script.js";
    import { MovieDetail } from "./component/MovieDetail/script.js";
    import { MovieCategory } from "./component/MovieCategory/script.js";
    import { DataProfile } from './data/dataProfile.js';
    import { Featured } from "./component/Featured/script.js";
    import { Statistic } from "./component/Statistic/script.js";


    window.C = {};

    let activeProfile = null;
    let moviesData = null;

    C.handlerAbout = function () {
      alert(
        "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
      );
    };

    C.start = async function () {
      let profiles = await DataProfile.read();

      V.renderNavBar("C.handlerHome()", "C.handlerSelectProfile", "C.handlerStatistics()", "C.handlerLogout()", "C.handlerSearch(this.value)", profiles);
      let content = document.querySelector("#content");
      content.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Veuillez sélectionner un profil pour voir les films.</h2>";
    };

    C.handlerLogout = function () {
      activeProfile = null;
      C.start();
    };

    C.handlerDetail = async function (id_film) {
      let detail = await DataMovie.requestMovieDetails(id_film);
      V.renderMovieDetails(detail);
    }

    C.handlerHome = async function () {
      if (activeProfile) {
        C.handlerSelectProfile(activeProfile);
      }
      else {
        C.start();
      }
    };

    C.handlerSelectProfile = async function (idProfil) {
      activeProfile = idProfil;
      let profiles = await DataProfile.read();
      let ageDuProfil = 0;
      for (let profil of profiles) {
        if (profil.id == idProfil) {
          ageDuProfil = profil.age_restriction;
        }
      }
      let moviesData = await DataMovie.requestMovies(ageDuProfil);
      let favoritesData = await DataMovie.readFavorites(activeProfile);
      let featuredData = await DataMovie.readFeaturedMovies();
      DataMovie.applyFavoriteTags(moviesData, favoritesData);
      V.renderMovie(moviesData, favoritesData, featuredData);
    };

    C.handlerAddFavorite = async function (id_film) {
      if (!activeProfile) {
        alert("Veuillez d'abord sélectionner un profil pour ajouter des favoris.");
        return;
      }
      let reponse = await DataMovie.addFavorite(activeProfile, id_film);
      alert(reponse);
      C.handlerSelectProfile(activeProfile);
    };

    C.handlerRemoveFavorite = async function (id_film) {
      if (!activeProfile) return;
      let reponse = await DataMovie.removeFavorite(activeProfile, id_film);
      alert(reponse);
      C.handlerSelectProfile(activeProfile);
    };


    C.handlerStatistics = async function () {
      let statsData = await DataMovie.readStatistics();
      V.renderStatistics(statsData);
    };


    C.handlerSearch = async function (keyword) {
      if (keyword.trim() === "") {
        if (activeProfile) {
          C.handlerSelectProfile(activeProfile);
        } else {
          C.start();
        }
        return;
      }
      let ageLimite = 0;
      let profiles = await DataProfile.read();
      for (let profil of profiles) {
        if (profil.id == activeProfile) {
          ageLimite = profil.age_restriction;
        }
      }
      let searchResults = await DataMovie.searchMovies(keyword, ageLimite);
      V.renderSearchResults(searchResults);
    };


    window.V = {};



    V.renderNavBar = function (hHome, hSelectProfile, hStats, hLogout, hSearch, profiles) {
      let header = document.querySelector("#header");
      header.innerHTML = NavBar.format(hHome, hSelectProfile, hStats, hLogout, hSearch, profiles);
    };

    V.formatFavorites = function (favorites) {
      if (favorites.length > 0) {
        return MovieCategory.format("Ma Liste de Favoris", favorites);
      }
      return "<h2 style='margin-left:20px;'>Ma Liste de Favoris</h2><p style='text-align:center; margin-bottom: 20px;'>Votre liste de favoris est vide.</p>";
    };

    V.renderMovie = function (data, favorites, featuredData) {
      let content = document.querySelector("#content");
      let html = "";

      if (featuredData) {
        html += Featured.format(featuredData);
      }
      if (favorites) {
        html += V.formatFavorites(favorites);
      }
      for (let categoryName in data) {
        html += MovieCategory.format(categoryName, data[categoryName]);
      }
      content.innerHTML = html;
    };

    V.renderMovieDetails = function (data) {
      let content = document.querySelector("#content");
      content.innerHTML = MovieDetail.format(data);
    };

    V.renderStatistics = function (statsData) {
      let content = document.querySelector("#content");
      content.innerHTML = Statistic.format(statsData);
    };

    V.renderSearchResults = function (movies) {
      let content = document.querySelector("#content");

      if (movies.length > 0) {
        content.innerHTML = MovieCategory.format("Résultats de la recherche", movies);
      } else {
        content.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Aucun film ne correspond à votre recherche.</h2>";
      }
    };

    C.start(); 
  </script>
</body>

</html>
<script type="module"></script>
