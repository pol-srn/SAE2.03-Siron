<li class="featured__card" onclick="C.handlerDetail('{{id}}')">
    <img src="{{image}}" alt="Affiche de {{title}}" class="featured__image">
    <div class="featured__content">
        <h3 class="featured__title">{{title}}</h3>
        <p class="featured__description">{{description}}</p>
    </div>
</li>
